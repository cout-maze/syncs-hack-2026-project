openapi: 3.0.3
info:
  title: Rebuild My City — City Advisor Service
  description: |
    AI-powered advisor module. Explains proposals, generates city newspaper
    editions, and returns citizen perspectives — all in structured JSON.

    Hard rules:
    - The Advisor explains and advises; it never changes game state.
    - It never predicts, assigns, or decides proposal voting scores.
    - On LLM failure/timeout: returns a canned fallback response with `fallback: true`.

    Supports two LLM backends via `LLM_PROVIDER` env var:
    - `anthropic` — Anthropic API with tool-forced structured output
    - `ollama` — local Ollama instance with JSON mode

    Owner: Backend #2. Consumers: Frontend.
  version: 2.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: advisor

paths:
  /advisor/proposal-explanation:
    post:
      tags: [advisor]
      operationId: explainProposal
      summary: Explain a proposal and its trade-offs in plain language
      description: |
        Loads the proposal, builds a prompt from proposal fields + the target
        block type's catalog description/benefits/tradeoffs. System prompt
        guardrail: describe the change and trade-offs, NEVER predict/score/
        recommend a vote, never mention vote counts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainProposalBody"
      responses:
        "200":
          description: Plain-language explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalExplanation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Proposal not found (PROPOSAL_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: LLM unavailable and fallback also failed (LLM_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /advisor/newspaper:
    post:
      tags: [advisor]
      operationId: generateNewspaper
      summary: Generate a city newspaper edition for a proposal
      description: |
        Produces a newspaper-style summary of a proposal including headline,
        summary paragraph, vote result string, and sidebar headlines. Uses
        proposal data + vote counts + block type info as context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainProposalBody"
      responses:
        "200":
          description: Newspaper edition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Newspaper"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Proposal not found (PROPOSAL_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /advisor/citizen-perspectives:
    post:
      tags: [advisor]
      operationId: generatePerspectives
      summary: Get citizen perspectives from 4 personas on a proposal
      description: |
        Returns first-person quotes from 4 fixed citizen personas
        (Older residents, Families, Remote workers, Students) plus a
        balanced advisor summary. Each perspective is a single sentence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainProposalBody"
      responses:
        "200":
          description: Citizen perspectives and advisor summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenPerspectivesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Proposal not found (PROPOSAL_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the Auth service.

  responses:
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ExplainProposalBody:
      type: object
      required: [proposalId]
      properties:
        proposalId:
          type: string
          example: prp_lightrail

    ProposalExplanation:
      type: object
      required: [explanation, fallback]
      properties:
        explanation:
          type: string
          description: What the proposal changes and who it affects — plain language.
          example: This proposal would replace the existing transport block with a light rail stop, improving connectivity to the hospital precinct.
        tradeoffs:
          type: array
          items: { type: string }
          example:
            - Improves east-side access to healthcare
            - Removes existing parking capacity
        fallback:
          type: boolean
          description: True when the response is a canned fallback because the LLM was unavailable.

    Newspaper:
      type: object
      required: [headline, summary, voteResult, otherHeadlines, fallback]
      properties:
        headline:
          type: string
          description: Main newspaper headline about the proposal.
          example: "Crown St Light Rail Plan Gains Momentum"
        summary:
          type: string
          description: Newspaper-style summary paragraph.
        voteResult:
          type: string
          description: Human-readable vote result string.
          example: "82% of residents support the proposal (18 up, 4 down)"
        otherHeadlines:
          type: array
          description: 2-4 sidebar headlines about related city topics.
          items: { type: string }
          example:
            - "Park usage up 15% this quarter"
            - "Tech hub construction on schedule"
            - "Housing committee meets Thursday"
        fallback:
          type: boolean

    CitizenPerspective:
      type: object
      required: [persona, emoji, quote]
      properties:
        persona:
          type: string
          description: Name of the citizen group.
          enum: [Older residents, Families, Remote workers, Students]
        emoji:
          type: string
          description: Emoji representing the group.
          enum: ["👵", "👨‍👩‍👧", "🧑‍💻", "🎓"]
        quote:
          type: string
          description: Single first-person sentence from the group's viewpoint.

    CitizenPerspectivesResponse:
      type: object
      required: [perspectives, advisorSummary, fallback]
      properties:
        perspectives:
          type: array
          description: Exactly 4 perspectives, one per persona.
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/CitizenPerspective"
        advisorSummary:
          type: string
          description: 1-2 sentence balanced assessment, never recommending a vote.
          example: This proposal would improve east-side connectivity but removes existing parking. Residents have mixed views on the trade-off.
        fallback:
          type: boolean

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: PROPOSAL_NOT_FOUND }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

security:
  - bearerAuth: []


