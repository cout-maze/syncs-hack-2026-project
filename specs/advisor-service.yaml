openapi: 3.0.3
info:
  title: Rebuild My City — Explainer Service
  description: |
    The app's only AI feature: a plain-language explanation of what a proposal
    changes, shown in the voting popup behind an "Explain this" button.

    **Hard rules:**
    - The AI explains the change and its trade-offs. It NEVER predicts, scores,
      recommends, or decides a vote. Vote counts come only from vote rows.
    - The LLM call happens server-side (Anthropic key never reaches the client).
    - Expect 2–8s latency — the FE shows a thinking state.
    - If the LLM is unavailable or times out, the server returns a canned
      explanation built from the proposal + the block-type catalog entry, with
      `fallback: true`. The FE renders it identically (optionally with a small
      "offline summary" hint).

    Owner: Backend #2. Consumer: FE #1 (popup).
  version: 2.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (single app, module-per-route-group)

tags:
  - name: explainer

paths:
  /advisor/proposal-explanation:
    post:
      tags: [explainer]
      operationId: explainProposal
      summary: Explain a proposal in plain language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposalId]
              properties:
                proposalId:
                  type: string
                  example: prp_lightrail
      responses:
        "200":
          description: The explanation (LLM or canned fallback).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalExplanation"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, expired, or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`PROPOSAL_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`LLM_UNAVAILABLE` — only when even the canned fallback cannot be produced."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT from auth-service. Claims: `sub`, `email`, `role`."

  schemas:
    ProposalExplanation:
      type: object
      required: [explanation, fallback]
      properties:
        explanation:
          type: string
          description: 2–4 sentences, plain language, no jargon, no vote recommendation.
          example: >-
            This proposal would replace the car park at (12, 7) with a light rail
            stop. It would shorten trips between the east side and the hospital
            precinct, but the parking spaces there would be lost.
        tradeoffs:
          type: array
          items: { type: string }
          description: Optional short bullet trade-offs drawn from the block-type catalog.
          example:
            - Shorter cross-town journeys
            - Existing parking at this cell is removed
        fallback:
          type: boolean
          description: True when this is the canned, non-LLM explanation.
          example: false

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: LLM_UNAVAILABLE
            message:
              type: string
            details:
              type: object
              additionalProperties: true

security:
  - bearerAuth: []
