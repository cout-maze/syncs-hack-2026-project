openapi: 3.0.3
info:
  title: Rebuild My City — City Service
  description: |
    The shared "city state" that every other feature reads from. The city-builder map is
    the product's main mechanic, and **both modes — Simulation and Proposal — render the
    same map**, so this service is the one everything else hangs off.

    Covers:
    - **Catalog** — the 8–9 block types (cost/benefits/trade-offs) and the 5–7 need
      profiles ("personas") the simulation tests journeys against. Static seed data,
      public, cacheable. Personas are **engine inputs, not a user-facing feature**: there
      is no residents screen anywhere in the product.
    - **Cities** — one or more cities per user: a grid (default 30×30, 100-block budget),
      a block budget, and placed blocks (place / move / remove / bulk save).
    - **Simulation results** — the simulation itself runs **client-side** (FE #2 owns the
      engine, in the browser next to Phaser). The backend only stores the latest result
      per city so it survives reloads and can be shown alongside Advisor output.
      Simulation mode's auto-detected issues, auto-drafted proposals and auto-ratings are
      **ephemeral browser state** and are deliberately not part of any schema here.

    Owner: Backend #1. Consumers: FE #1 (map workspace), FE #2 (Simulation mode),
    FE #3 (Proposal mode), Advisor module.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (single app, module-per-route-group)

tags:
  - name: catalog
    description: Static block-type and persona (need-profile) data (public)
  - name: cities
    description: City CRUD and grid state (authenticated, owner-only)
  - name: blocks
    description: Placing, moving and removing blocks
  - name: simulation
    description: Storing/retrieving the latest client-computed simulation result

paths:
  /catalog/block-types:
    get:
      tags: [catalog]
      operationId: listBlockTypes
      summary: List all placeable block types
      security: []
      responses:
        "200":
          description: The block catalog (8–9 types for the MVP).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockType"

  /catalog/personas:
    get:
      tags: [catalog]
      operationId: listPersonas
      summary: List the simulation's resident need profiles
      security: []
      responses:
        "200":
          description: |
            The 5–7 need profiles the client-side simulation tests journeys against.
            Engine input only — the product has no residents screen; these never appear as a
            browsable feature. Journey failures surface inside Simulation mode's results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Persona"

  /cities:
    get:
      tags: [cities]
      operationId: listCities
      summary: List the current user's cities
      responses:
        "200":
          description: Cities owned by the authenticated user (most recent first).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [cities]
      operationId: createCity
      summary: Create a new city
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                  default: My City
      responses:
        "201":
          description: New empty city with default 30×30 grid and 100-block budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cities/{cityId}:
    parameters:
      - $ref: "#/components/parameters/cityId"
    get:
      tags: [cities]
      operationId: getCity
      summary: Get full city state (grid, blocks, budget, last simulation)
      responses:
        "200":
          description: The city.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [cities]
      operationId: renameCity
      summary: Rename a city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "200":
          description: Updated city.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [cities]
      operationId: deleteCity
      summary: Delete a city
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cities/{cityId}/blocks:
    parameters:
      - $ref: "#/components/parameters/cityId"
    post:
      tags: [blocks]
      operationId: placeBlock
      summary: Place one block on the grid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typeId, x, y]
              properties:
                typeId: { type: string, example: healthcare }
                x: { type: integer, minimum: 0, example: 4 }
                y: { type: integer, minimum: 0, example: 7 }
      responses:
        "201":
          description: Block placed; response includes updated budget usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cell occupied, coordinates out of bounds, or block budget exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [blocks]
      operationId: replaceBlocks
      summary: Bulk-replace all placed blocks (autosave)
      description: |
        Replaces the entire block layout in one call. Recommended for the builder UI:
        drag-and-drop mutates local Phaser/React state instantly, then autosaves the whole
        layout (debounced) with this endpoint. The granular endpoints exist for
        simpler flows and for testing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocks]
              properties:
                blocks:
                  type: array
                  items:
                    $ref: "#/components/schemas/PlacedBlockInput"
      responses:
        "200":
          description: Full layout saved; returns the updated city.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Layout invalid (overlapping cells, out of bounds, or over budget). Nothing is saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cities/{cityId}/blocks/{blockId}:
    parameters:
      - $ref: "#/components/parameters/cityId"
      - name: blockId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [blocks]
      operationId: moveBlock
      summary: Move a placed block to a new cell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y]
              properties:
                x: { type: integer, minimum: 0 }
                y: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Block moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Target cell occupied or out of bounds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [blocks]
      operationId: removeBlock
      summary: Remove a placed block
      responses:
        "200":
          description: Block removed; response includes updated budget usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cities/{cityId}/simulation:
    parameters:
      - $ref: "#/components/parameters/cityId"
    put:
      tags: [simulation]
      operationId: saveSimulationResult
      summary: Save the latest client-computed simulation result
      description: |
        The simulation engine runs in the browser (FE #2). After each run, the frontend
        PUTs the result here so it persists across reloads and can be fed to the Advisor.
        The backend stores it verbatim (schema-validated) — it does not recompute anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationResultInput"
      responses:
        "200":
          description: Stored; returned with server timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: Result does not match the SimulationResult schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [simulation]
      operationId: getSimulationResult
      summary: Get the latest stored simulation result for a city
      responses:
        "200":
          description: The latest stored result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: City not found, or no simulation has been saved yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the Auth service.

  parameters:
    cityId:
      name: cityId
      in: path
      required: true
      schema: { type: string }
      example: cty_a1b2c3

  responses:
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found or not owned by the current user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    BlockType:
      type: object
      description: A placeable service/block type from the catalog.
      required: [id, name, category, cost, description]
      properties:
        id:
          type: string
          description: Stable slug used everywhere (PlacedBlock.typeId, proposals, sim engine).
          enum: [housing, healthcare, education, transport, park, community_hub, technology_hub, shared_resource_hub, culture_heritage]
        name: { type: string, example: Healthcare }
        category:
          type: string
          enum: [people, service, infrastructure, community, technology, culture]
        cost:
          type: integer
          description: Blocks of budget consumed per placement.
          minimum: 1
          example: 2
        description: { type: string, example: Provides essential medical access. }
        benefits:
          type: array
          items: { type: string }
          example: [Improves accessibility for nearby housing]
        tradeoffs:
          type: array
          items: { type: string }
          example: [Poor placement increases journey time for some residents]
        icon:
          type: string
          description: Asset key for the Phaser sprite / UI icon.
          example: block-healthcare

    Persona:
      type: object
      description: |
        A representative resident need profile the simulation tests the layout against.
        Consumed by the sim engine only — not surfaced as a user-facing feature.
      required: [id, name, description, priorityServices]
      properties:
        id:
          type: string
          enum: [older_resident, wheelchair_user, parent_stroller, child_student, remote_worker, limited_digital_access, non_english_speaker]
        name: { type: string, example: Wheelchair user }
        description:
          type: string
          example: Affected by inaccessible routes, stairs and unsuitable transport connections.
        priorityServices:
          type: array
          description: Block-type ids this persona most needs to reach.
          items: { type: string }
          example: [healthcare, transport]
        accessibilityNeeds:
          type: array
          items: { type: string }
          example: [step_free_routes, accessible_transport]
        maxComfortableJourneyMinutes:
          type: integer
          description: Journey-time threshold the sim engine uses to flag problems.
          example: 15

    PlacedBlockInput:
      type: object
      required: [typeId, x, y]
      properties:
        typeId: { type: string, example: housing }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }

    PlacedBlock:
      allOf:
        - $ref: "#/components/schemas/PlacedBlockInput"
        - type: object
          required: [id]
          properties:
            id: { type: string, example: blk_9x7q }

    CitySummary:
      type: object
      required: [id, name, blocksUsed, blockBudget, updatedAt]
      properties:
        id: { type: string, example: cty_a1b2c3 }
        name: { type: string, example: Riverside }
        blocksUsed: { type: integer, example: 42 }
        blockBudget: { type: integer, example: 100 }
        updatedAt: { type: string, format: date-time }

    City:
      type: object
      description: The full city state — the single integration point for map, sim, advisor and proposals.
      required: [id, ownerId, name, gridWidth, gridHeight, blockBudget, blocksUsed, blocks, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        gridWidth: { type: integer, example: 30 }
        gridHeight: { type: integer, example: 30 }
        blockBudget: { type: integer, example: 100 }
        blocksUsed:
          type: integer
          description: Sum of cost over placed blocks. Derived by the server; never trusted from the client.
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PlacedBlock"
        lastSimulation:
          type: object
          nullable: true
          description: Latest stored simulation result; null until the first client-side run is saved.
          allOf:
            - $ref: "#/components/schemas/SimulationResult"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BlockMutationResult:
      type: object
      required: [block, blocksUsed, blockBudget]
      properties:
        block:
          $ref: "#/components/schemas/PlacedBlock"
        blocksUsed: { type: integer }
        blockBudget: { type: integer }

    Metrics:
      type: object
      description: |
        The six city metrics, each 0–100. Computed by the client-side sim engine.
        Keep keys in sync with the Zod schema in the frontend and with Proposal voting metrics.
      required: [accessibility, sustainability, efficiency, community, resilience, inclusion]
      properties:
        accessibility: { type: number, minimum: 0, maximum: 100 }
        sustainability: { type: number, minimum: 0, maximum: 100 }
        efficiency: { type: number, minimum: 0, maximum: 100 }
        community: { type: number, minimum: 0, maximum: 100 }
        resilience: { type: number, minimum: 0, maximum: 100 }
        inclusion: { type: number, minimum: 0, maximum: 100 }

    Journey:
      type: object
      description: |
        One journey the simulation tests for a need profile (e.g. housing → transport →
        healthcare). Failed journeys are what Simulation mode turns into auto-issues.
      required: [personaId, targetService, travelTimeMinutes, accessible]
      properties:
        personaId: { type: string, example: wheelchair_user }
        fromBlockId: { type: string, nullable: true }
        targetService:
          type: string
          description: Block-type id the resident is trying to reach.
          example: healthcare
        pathBlockIds:
          type: array
          description: Ordered placed-block ids along the route (for map animation).
          items: { type: string }
        travelTimeMinutes: { type: number, example: 22 }
        accessible:
          type: boolean
          description: False when the route is too long or unusable for this persona.
        issues:
          type: array
          items: { type: string }
          example: [Journey exceeds 15 minutes, No accessible transport on route]

    EventResult:
      type: object
      description: Outcome of one simulated city event.
      required: [eventType, passed, summary]
      properties:
        eventType:
          type: string
          enum: [flood, tech_outage, population_change]
        passed:
          type: boolean
          description: Whether the city kept functioning through the event.
        affectedBlockIds:
          type: array
          items: { type: string }
        affectedPersonaIds:
          type: array
          items: { type: string }
        summary:
          type: string
          example: The flood cut the only route to healthcare for the northern housing blocks.

    SimulationResultInput:
      type: object
      required: [metrics, journeys, events]
      properties:
        metrics:
          $ref: "#/components/schemas/Metrics"
        journeys:
          type: array
          items:
            $ref: "#/components/schemas/Journey"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventResult"
        engineVersion:
          type: string
          description: Version of the client-side sim engine that produced this result.
          example: 0.3.0

    SimulationResult:
      allOf:
        - $ref: "#/components/schemas/SimulationResultInput"
        - type: object
          required: [runAt]
          properties:
            runAt:
              type: string
              format: date-time
              description: Server timestamp when the result was stored.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: BUDGET_EXCEEDED }
            message: { type: string, example: Placing this block would exceed the 100-block budget. }
            details:
              type: object
              additionalProperties: true

security:
  - bearerAuth: []
