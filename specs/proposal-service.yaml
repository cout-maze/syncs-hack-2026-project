openapi: 3.0.3
info:
  title: Rebuild My City — Proposal & Voting Service
  description: |
    Civic core — admin proposals, thumbs up/down voting with honest counts,
    and the demo's emotional beat ("the audience votes and the numbers move").

    Rules (non-negotiable for the demo):
    - Outcomes are derived from submitted votes, never AI-generated.
    - One vote per user per proposal: up or down. Re-submitting updates.
    - Counts derive only from Vote rows — no offsets, no fabrication.
    - Proposals are `open` until closed by admin. Status is `open` or `closed`.

    Owner: Backend #2. Consumers: Frontend.
  version: 2.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: proposals
  - name: votes
  - name: admin
    description: Admin-only operations

paths:
  /proposals:
    get:
      tags: [proposals]
      operationId: listProposals
      summary: List proposals with vote counts
      description: Public, no auth required. Returns newest first.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: Proposals, newest first, each with up/down counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"

    post:
      tags: [proposals]
      operationId: createProposal
      summary: Create a proposal (admin only)
      description: |
        Validates against the current real city map:
        - `add` needs the cell empty (409 CELL_OCCUPIED)
        - `replace`/`remove` need it occupied (409 CELL_EMPTY)
        - coordinates must be in bounds (400 OUT_OF_BOUNDS)
        - max one open proposal per cell (409 PROPOSAL_EXISTS_AT_CELL)
        - `blockTypeId` required unless changeType is `remove` (400 BLOCK_TYPE_REQUIRED)
        - `blockTypeId` must be a known slug (400 BLOCK_TYPE_INVALID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "400":
          description: Validation failed (OUT_OF_BOUNDS, BLOCK_TYPE_REQUIRED, BLOCK_TYPE_INVALID).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict (CELL_OCCUPIED, CELL_EMPTY, PROPOSAL_EXISTS_AT_CELL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/proposalId"
    get:
      tags: [proposals]
      operationId: getProposal
      summary: Get proposal detail with the current user's vote
      description: |
        Optional auth — `myVote` is included when authenticated, null when anonymous
        or when the user hasn't voted.
      responses:
        "200":
          description: Proposal detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /proposals/{proposalId}/vote:
    parameters:
      - $ref: "#/components/parameters/proposalId"
    put:
      tags: [votes]
      operationId: setVote
      summary: Cast or update a vote (auth required)
      description: |
        Upsert on (userId, proposalId). Idempotent — same value twice is a 200 no-op.
        Closed proposal returns 409 PROPOSAL_CLOSED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVoteBody"
      responses:
        "200":
          description: Vote recorded. Returns updated state so the UI can repaint immediately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteState"
        "400":
          description: Invalid vote value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Proposal is closed — votes no longer accepted (PROPOSAL_CLOSED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [votes]
      operationId: retractVote
      summary: Retract a vote (auth required)
      description: |
        Deletes the user's vote if it exists. Always returns 200 with myVote: null.
        Closed proposal returns 409 PROPOSAL_CLOSED.
      responses:
        "200":
          description: Vote retracted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Proposal is closed (PROPOSAL_CLOSED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposals/{proposalId}/close:
    parameters:
      - $ref: "#/components/parameters/proposalId"
    post:
      tags: [admin]
      operationId: closeProposal
      summary: Close voting on a proposal (admin only)
      description: |
        Sets status to `closed` and records `closedAt`. Counts freeze automatically
        because further votes are rejected. Never touches the map.
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already closed (PROPOSAL_CLOSED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the Auth service.

  parameters:
    proposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string }
      example: prp_lightrail

  responses:
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Proposal not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ChangeType:
      type: string
      enum: [add, replace, remove]

    VoteValue:
      type: string
      enum: [up, down]

    ProposalStatus:
      type: string
      enum: [open, closed]

    BlockTypeId:
      type: string
      enum:
        - housing
        - healthcare
        - education
        - transport
        - park
        - community_hub
        - technology_hub
        - shared_resource_hub
        - culture_heritage

    BlockChange:
      type: object
      description: |
        One edit to the city map that this proposal would make. Authored by editing the
        shared city-builder map; rendered back onto it as a preview (ghosted additions,
        struck-through removals) when a citizen opens the proposal.
      required: [op, x, y]
      properties:
        op:
          type: string
          enum: [place, remove, move]
        typeId:
          type: string
          description: Block-type id from the City service catalog. Required for `place`.
          example: park
        x: { type: integer, minimum: 0, example: 3 }
        y: { type: integer, minimum: 0, example: 2 }
        blockId:
          type: string
          description: Existing placed-block id. Required for `remove` and `move`.
          nullable: true

    ProposalInput:
      type: object
      required: [title, description, x, y, changeType]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          example: Light rail on Crown St
        description:
          type: string
          minLength: 1
          maxLength: 500
          example: Replace the car park with a light rail stop connecting the east side to the hospital precinct.
        x:
          type: integer
          minimum: 0
          example: 12
        y:
          type: integer
          minimum: 0
          example: 7
        changeType:
          $ref: "#/components/schemas/ChangeType"
        blockTypeId:
          type: string
          nullable: true
          description: Required for `add` and `replace`, omit for `remove`.
          example: transport

    VoteCounts:
      type: object
      required: [up, down]
      properties:
        up:
          type: integer
          minimum: 0
          example: 18
        down:
          type: integer
          minimum: 0
          example: 4

    Proposal:
      type: object
      required: [id, title, description, x, y, changeType, status, counts, createdAt, closedAt]
      properties:
        id: { type: string, example: prp_lightrail }
        title: { type: string, example: Light rail on Crown St }
        description: { type: string }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        changeType:
          $ref: "#/components/schemas/ChangeType"
        blockTypeId:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProposalStatus"
        counts:
          $ref: "#/components/schemas/VoteCounts"
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true

    ProposalDetail:
      allOf:
        - $ref: "#/components/schemas/Proposal"
        - type: object
          required: [myVote]
          properties:
            myVote:
              type: string
              nullable: true
              description: The current user's vote (up/down), or null if not voted or anonymous.
              enum: [up, down]

    SetVoteBody:
      type: object
      required: [value]
      properties:
        value:
          $ref: "#/components/schemas/VoteValue"

    VoteState:
      type: object
      required: [myVote, counts]
      properties:
        myVote:
          type: string
          nullable: true
          enum: [up, down]
        counts:
          $ref: "#/components/schemas/VoteCounts"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: PROPOSAL_CLOSED }
            message: { type: string, example: Voting has closed for this proposal. }
            details:
              type: object
              additionalProperties: true

security:
  - bearerAuth: []


