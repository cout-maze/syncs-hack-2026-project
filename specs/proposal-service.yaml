openapi: 3.0.3
info:
  title: Rebuild My City — Proposal Service
  description: |
    Development proposals and thumbs voting.

    A **proposal** is exactly one cell change on the shared map — `add`, `replace`,
    or `remove` a block at `(x, y)` — written by an admin with a title and
    description. Open proposals show as indicators on the map; clicking one opens
    the voting popup.

    **Voting**: one vote per user per proposal, `up` or `down`, always retractable
    and switchable while the proposal is open. Counts are public and derive only
    from vote rows — never from AI, never from counters.

    **The toggle contract** (the FE's whole interaction logic):
    - tap the thumb matching `myVote` → `DELETE .../vote` (retract)
    - tap the other thumb → `PUT .../vote` with the new value (switch)
    - `PUT` with the same value twice → 200, unchanged (idempotent)

    **Closing** (admin): sets `status: closed`, rejects further votes (409
    `PROPOSAL_CLOSED`) — which freezes the counts automatically. Closing NEVER
    changes the map; if the government builds the change, an admin makes the
    matching edit via map-service (`PUT/DELETE /map/blocks/{x}/{y}`).

    Owner: Backend #2. Consumers: FE #1 (indicators + popup), FE #2 (admin).
  version: 2.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (single app, module-per-route-group)

tags:
  - name: proposals
  - name: votes
  - name: admin
    description: Admin-only (403 FORBIDDEN for role `user`).

paths:
  /proposals:
    get:
      tags: [proposals]
      operationId: listProposals
      summary: List proposals (with vote counts)
      description: |
        Public. Enough to draw every map indicator: cell, change, status, counts.
        Poll every ~10s for the map view.
      security: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed]
          description: Filter by status; omit for all.
      responses:
        "200":
          description: All proposals, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
    post:
      tags: [admin]
      operationId: createProposal
      summary: "Admin: propose a one-cell change"
      description: |
        Validated against the current map: `add` needs an empty cell,
        `replace`/`remove` need an occupied one, and a cell can hold at most one
        **open** proposal. Proposals are validated only at creation — if an admin
        later edits the map underneath one, the UI may show a mismatch (accepted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalInput"
      responses:
        "201":
          description: Created — appears as an open indicator for everyone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "400":
          description: |
            `VALIDATION_ERROR`, `OUT_OF_BOUNDS`, `BLOCK_TYPE_INVALID`, or
            `BLOCK_TYPE_REQUIRED` (`blockTypeId` is required unless `changeType`
            is `remove`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `CELL_OCCUPIED` (add on an occupied cell), `CELL_EMPTY`
            (replace/remove on an empty cell), or `PROPOSAL_EXISTS_AT_CELL`
            (cell already has an open proposal).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    get:
      tags: [proposals]
      operationId: getProposal
      summary: Get one proposal (the popup's poll target)
      description: |
        Optional auth: with a bearer token the response includes `myVote`
        (`null` if you haven't voted); without one, `myVote` is always `null`.
        The open popup polls this every ~5s for live counts.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Proposal with counts and (if authenticated) my vote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        "404":
          $ref: "#/components/responses/ProposalNotFound"

  /proposals/{proposalId}/close:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    post:
      tags: [admin]
      operationId: closeProposal
      summary: "Admin: close voting on a proposal"
      description: |
        Sets `status: closed` and `closedAt`. Votes are rejected from now on, so
        the counts are frozen as-is — no snapshot is taken. The map is untouched;
        building the change is a separate map-service edit. Closed proposals stay
        visible (greyed) on the map.
      responses:
        "200":
          description: The closed proposal with final counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProposalNotFound"
        "409":
          description: "`PROPOSAL_CLOSED` — already closed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposals/{proposalId}/vote:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    put:
      tags: [votes]
      operationId: setVote
      summary: Cast or switch my vote
      description: |
        Sets my vote to `value`, replacing any previous vote (switch). Idempotent:
        re-`PUT`ting the same value is a 200 no-op. At most one vote row per
        (user, proposal) exists server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  $ref: "#/components/schemas/VoteValue"
      responses:
        "200":
          description: My new vote state plus fresh counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProposalNotFound"
        "409":
          description: "`PROPOSAL_CLOSED` — voting has ended."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [votes]
      operationId: retractVote
      summary: Retract my vote
      description: |
        Removes my vote (tap the same thumb again). Idempotent — 200 with
        `myVote: null` even if I had no vote.
      responses:
        "200":
          description: My cleared vote state plus fresh counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProposalNotFound"
        "409":
          description: "`PROPOSAL_CLOSED` — voting has ended."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT from auth-service. Claims: `sub`, `email`, `role`."

  parameters:
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string }
      example: prp_lightrail

  responses:
    BadRequest:
      description: Validation failed (missing/invalid fields).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`FORBIDDEN` — requires role `admin`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProposalNotFound:
      description: "`PROPOSAL_NOT_FOUND`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ChangeType:
      type: string
      enum: [add, replace, remove]
      example: replace

    VoteValue:
      type: string
      enum: [up, down]
      example: up

    VoteCounts:
      type: object
      required: [up, down]
      properties:
        up:
          type: integer
          minimum: 0
          example: 15230
        down:
          type: integer
          minimum: 0
          example: 10114

    ProposalInput:
      type: object
      required: [title, description, x, y, changeType]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          example: Light rail stop on Crown St
        description:
          type: string
          minLength: 1
          maxLength: 500
          example: Replace the car park with a light rail stop connecting the east side to the hospital precinct.
        x:
          type: integer
          minimum: 0
          example: 12
        y:
          type: integer
          minimum: 0
          example: 7
        changeType:
          $ref: "#/components/schemas/ChangeType"
        blockTypeId:
          type: string
          nullable: true
          description: The block type being built. Required unless `changeType` is `remove`.
          example: transport

    Proposal:
      allOf:
        - $ref: "#/components/schemas/ProposalInput"
        - type: object
          required: [id, status, counts, createdAt, closedAt]
          properties:
            id:
              type: string
              example: prp_lightrail
            status:
              type: string
              enum: [open, closed]
              example: open
            counts:
              $ref: "#/components/schemas/VoteCounts"
            createdAt:
              type: string
              format: date-time
            closedAt:
              type: string
              format: date-time
              nullable: true

    ProposalDetail:
      allOf:
        - $ref: "#/components/schemas/Proposal"
        - type: object
          required: [myVote]
          properties:
            myVote:
              type: string
              enum: [up, down]
              nullable: true
              description: My current vote; null if not voted or not authenticated.

    VoteState:
      type: object
      required: [myVote, counts]
      properties:
        myVote:
          type: string
          enum: [up, down]
          nullable: true
        counts:
          $ref: "#/components/schemas/VoteCounts"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: PROPOSAL_CLOSED
            message:
              type: string
              example: Voting on this proposal has ended.
            details:
              type: object
              additionalProperties: true

security:
  - bearerAuth: []
